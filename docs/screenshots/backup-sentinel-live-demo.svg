<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Backup Sentinel actual command-line output</title>
<desc id="desc">A terminal-style visual showing output from the real Backup Sentinel command-line program running against a local synthetic demo.</desc>
<rect width="1120" height="470" rx="20" fill="#0b1020"/>
<rect x="1" y="1" width="1118" height="468" rx="19" fill="none" stroke="#26324a" stroke-width="2"/>
<rect x="0" y="0" width="1120" height="11" rx="5" fill="#42d3a5"/>
<text x="40" y="55" fill="#f3f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Backup Sentinel</text>
<text x="40" y="83" fill="#aab7ca" font-family="Segoe UI, Arial, sans-serif" font-size="16">Backup freshness and checksum audit</text>
<rect x="40" y="102" width="232" height="24" rx="12" fill="#143b35"/>
<text x="56" y="119" fill="#7ee0b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ACTUAL PROGRAM OUTPUT</text>
<rect x="24" y="146" width="1072" height="266" rx="12" fill="#090d17" stroke="#202b40"/>
<circle cx="49" cy="172" r="6" fill="#ff6c67"/><circle cx="70" cy="172" r="6" fill="#ffc857"/><circle cx="91" cy="172" r="6" fill="#4fd1a1"/>
<text x="112" y="177" fill="#71809a" font-family="Segoe UI, Arial, sans-serif" font-size="12">local CLI session</text>
<line x1="40" y1="198" x2="1080" y2="198" stroke="#1c2739"/>
<text x="48" y="234" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">Backup Sentinel report: .\backup-sentinel.json</text><text x="48" y="258" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">Findings: 2 error, 0 warning, 0 info</text><text x="48" y="282" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">[ERROR] backup-stale — nightly-assets (.\synthetic-backups\assets\archive.tar.gz): Newest matching backup is</text><text x="48" y="306" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">    72.0 hours old; the maximum is 26 hours.</text><text x="48" y="330" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">[ERROR] checksum-mismatch — nightly-assets (.\synthetic-backups\assets\archive.tar.gz): Backup content does</text><text x="48" y="354" fill="#d5deeb" font-family="Consolas, 'Courier New', monospace" font-size="15">    not match its adjacent SHA-256 checksum.</text>
<text x="40" y="443" fill="#71809a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">REAL LOCAL RUN  |  SYNTHETIC BACKUPS  |  LOCAL PATHS SHORTENED</text>
</svg>
